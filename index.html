<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photography Studio</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background: #f7f7f7;
      }

      .container {
        max-width: 900px;
        margin: 50px auto;
        padding: 20px;
        background: #ffffff;
        text-align: center;
        border-radius: 8px;
      }

      h1 {
        margin-bottom: 16px;
        color: #333;
      }

      p {
        color: #666;
        font-size: 18px;
        line-height: 1.6;
      }

      img {
        margin-top: 25px;
        max-width: 100%;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1 id="title"></h1>
      <p id="description"></p>
      <img id="heroImage" alt="Photography Sample" />
    </div>

    <script>
      fetch("/content/home.json")
        .then((res) => res.json())
        .then((data) => {
          document.getElementById("title").innerText = data.title;
          document.getElementById("description").innerText = data.description;
          document.getElementById("heroImage").src = data.image;
        });
    </script>
  </body>
</html>
